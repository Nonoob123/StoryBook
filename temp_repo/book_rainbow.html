.control-panel{position:fixed;top:15px;right:15px;z-index:1000;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.95);border:2px solid #e0d4f5;border-radius:30px;padding:5px 10px;box-shadow:0 2px 15px rgba(0,0,0,0.1);flex-wrap:wrap;justify-content:flex-end;max-width:500px}
.control-btn{background:none;border:none;font-size:1.2em;cursor:pointer;padding:2px 5px;border-radius:50%;transition:all 0.3s ease}

.settings-btn{background:none;border:none;font-size:1.5em;cursor:pointer;padding:2px 5px;border-radius:50%;transition:all 0.3s ease}

.settings-panel button:last-child{background:#f0f0f0;color:#333}

.book-page{background:white;border-radius:25px;box-shadow:0 10px 40px rgba(0,0,0,0.1);overflow:hidden;max-width:750px;width:100%;transition:background 0.5s ease}
.page-content{padding:30px}

.modal.active{display:flex}

.title-page .continue-btn:hover{background:#667eea;color:white}

</style>
</head>

<button class="home-btn" onclick="window.location.href='index.html'">🏠 返回首页</button>

<div class="modal" id="imageModal" onclick="closeM()">

        <div style="margin:30px 0">
          <span style="display:inline-block;padding:6px 16px;background:linear-gradient(135deg,#e1f5fe,#b3e5fc);border-radius:20px;margin:5px;color:#0277bd;font-size:0.9em">🌱 耐心</span>

      </div>
    </div>

  <div class="page" id="endingPage">

  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="control-panel">
  <button class="control-btn" id="musicToggle" onclick="toggleMusic()" title="背景音乐">🎵</button>

  <input type="range" id="fontSizeSlider" min="14" max="32" value="20" oninput="setFontSize(this.value)">

</div>

<div class="page-jump">
  <label>跳转到：</label>
  <input type="number" id="pageJumpInput" min="1" value="1">
  <button onclick="jumpToPage()">跳转</button>
</div>

<script>
var pages=[
  {image:"images/rainbow_scene01.png",dialogs:[{type:"rabbit",text:"有一天，小兔子波波在森林里散步，突然发现草丛里有一颗闪闪发光的东西！"}],narration:"阳光透过树叶洒下来，那颗东西发出七彩的光芒，漂亮极了！"},
  {image:"images/rainbow_scene02.png",dialogs:[{type:"rabbit",text:"好漂亮啊！这是什么东西呀？"},{type:"squirrel",text:"哇！波波你快看！那颗东西在发光呢！"}],narration:"小松鼠朵朵正好路过，也被发光的东西吸引了过来。"},
  {image:"images/rainbow_scene03.png",dialogs:[{type:"rabbit",text:"朵朵你来看！这是一颗种子！"},{type:"squirrel",text:"种子？可是从来没有见过这么漂亮的种子！它是什么颜色的都有！"}],narration:"他们仔细观察这颗种子，发现它上面有红色、橙色、黄色、绿色、蓝色、靛色和紫色，像彩虹一样美丽！"},
  {image:"images/rainbow_scene04.png",dialogs:[{type:"rabbit",text:"我们来把它种下去吧！一定会长出很美丽的东西！"},{type:"squirrel",text:"好主意！我们一起种！我知道哪里最适合种种子了！"}],narration:"两个好朋友决定一起把彩虹种子种下去，他们来到了森林旁边的一片空地。"},
  {image:"images/rainbow_scene05.png",dialogs:[{type:"squirrel",text:"就是这里！这里的阳光最好，泥土也很松软！"},{type:"rabbit",text:"好的！我来挖洞，你来放种子！"}],narration:"朵朵找了一个阳光充足、泥土松软的地方，波波用他有力的小爪子挖了一个小洞。"},
  {image:"images/rainbow_scene06.png",dialogs:[{type:"rabbit",text:"种子放进去啦！"},{type:"squirrel",text:"现在盖土！盖好土！"}],narration:"波波小心翼翼地把彩虹种子放进洞里，朵朵轻轻地把土盖上去，还用小脚丫踩了踩。"},
  {image:"images/rainbow_scene07.png",dialogs:[{type:"squirrel",text:"现在我们来浇水吧！"},{type:"rabbit",text:"好的！我去打井水！"},{type:"squirrel",text:"我也来帮忙！我们一起浇！"}],narration:"两个好朋友去打来了清澈的井水，一起浇在了种子的位置上。"},
  {image:"images/rainbow_scene08.png",dialogs:[{type:"rabbit",text:"种子已经种好了！"},{type:"squirrel",text:"波波快看！发芽了发芽了！"}],narration:"小芽嫩绿嫩绿的，看起来娇滴滴的，两个好朋友高兴极了！"},

  {image:"images/rainbow_scene10.png",dialogs:[{type:"squirrel",text:"小芽小芽，你要快快长大哦！"},{type:"rabbit",text:"对啊对啊，你会长成一棵大树吗？"}],narration:"小芽听了他们的话，好像真的长大了不少呢！"},
  {image:"images/rainbow_scene11.png",dialogs:[{type:"rabbit",text:"哎呀！天黑了，我们该回家了！"},{type:"squirrel",text:"明天见哦小芽！我们会再来看你的！"}],narration:"就这样过了一天又一天，小芽慢慢长高，长出了一片又一片叶子。"},

  {image:"images/rainbow_scene13.png",dialogs:[{type:"rabbit",text:"花苞要开了！朵朵你快看！"},{type:"squirrel",text:"太美了！我从来没有见过这么漂亮的花苞！"}],narration:"两个好朋友兴奋极了，他们每天都围着花苞转，期待着花苞打开的那一刻。"},
  {image:"images/rainbow_scene14.png",dialogs:[{type:"rabbit",text:"哇！彩虹花开了！"},{type:"squirrel",text:"好美啊！红色的、橙色的、黄色的、绿色的、蓝色的、靛色的、紫色的！"}],narration:"花苞终于打开了！里面是一棵小小的彩虹树，树上的叶子闪烁着彩虹般的光芒！"},

var currentPage=0;
var isDarkMode=false;
var currentVolume=50;
var audioCtx=null;
var musicOscillators=[];
var musicLoopId=null;
var isMusicPlaying=false;
function toggleDarkMode(){
  isDarkMode=!isDarkMode;
  document.body.classList.toggle('dark-mode');
  document.getElementById('darkModeToggle').textContent=isDarkMode?'☀️':'🌙';
}
function setFontSize(v){
  document.getElementById('fontSizeLabel').textContent=v+'px';
  document.querySelectorAll('.page-content').forEach(function(el){el.style.fontSize=v+'px'});
}
function toggleSettingsPanel(){document.getElementById('settingsPanel').classList.toggle('active')}
function resetSettings(){document.getElementById('fontSizeSlider').value=20;document.body.classList.remove('dark-mode');document.getElementById('fontSizeSlider').dispatchEvent(new Event('input'));toggleSettingsPanel()}
function renderP(){
  var c=document.getElementById('pagesContainer');
  var h='';
  for(var i=0;i<pages.length;i++){
    h+='<div class="page" id="page-'+i+'"><div class="book-page"><div class="page-content">';
    if(pages[i].image)h+='<img src="'+pages[i].image+'" alt="第'+(i+1)+'页" loading="lazy" onclick="showM(this.src)">';
    if(pages[i].dialogs){
      for(var j=0;j<pages[i].dialogs.length;j++){
        var d=pages[i].dialogs[j];
        if(d.type==='rabbit')h+='<div class="dialog-rabbit">🐰 '+d.text+'</div>';
        else if(d.type==='squirrel')h+='<div class="dialog-squirrel">🐿️ '+d.text+'</div>';
      }
    }
    if(pages[i].narration)h+='<p class="narration">'+pages[i].narration+'</p>';
    h+='<div style="text-align:center"><span class="page-number">第'+(i+1)+'页 / 共'+pages.length+'页</span></div>';
    h+='</div>';
    h+='<div class="page-navigation">';
    h+='<button class="nav-btn" onclick="prevP()" '+(i===0?'disabled':'')+'>'+(i===0?'':'⬅️ 上一页')+'</button>';
    h+='<button class="nav-btn" onclick="nextP()" '+(i===pages.length-1?'disabled':'')+'>'+(i===pages.length-1?'':'下一页 ➡️')+'</button>';
    h+='</div></div></div>';
  }
  c.innerHTML=h;
}
function goPage(n){
  var pages=document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++)pages[i].classList.remove('active');
  currentPage=n;
  var el=document.getElementById('page-'+n);
  if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'start'})}
  document.getElementById('progressFill').style.width=((n+1)/pages.length*100)+'%';
  var sp=n>0?'rainbowSeedLastPage':'rainbowSeedLastPage';
  localStorage.setItem(sp,n);
  playSound('page');
}
function nextP(){if(currentPage<pages.length-1)goPage(currentPage+1)}
function prevP(){if(currentPage>0)goPage(currentPage-1)}
function showM(s){document.getElementById('modalImg').src=s;document.getElementById('imageModal').classList.add('active')}
function closeM(){document.getElementById('imageModal').classList.remove('active')}
function updProg(){document.getElementById('progressFill').style.width=((currentPage+1)/pages.length*100)+'%';document.getElementById('pageJumpInput').max=pages.length;document.getElementById('pageJumpInput').value=currentPage+1}
function jumpToPage(){var p=parseInt(document.getElementById('pageJumpInput').value);if(p>=1&&p<=pages.length)goPage(p-1)}
function initAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function createGentleMelody(){
  if(!audioCtx)initAC();
  if(musicLoopId){clearTimeout(musicLoopId);musicLoopId=null;}
  musicOscillators.forEach(function(o){try{o.stop()}catch(e){}try{o.disconnect()}catch(e2){}});
  musicOscillators=[];
  var master=audioCtx.createGain();
  master.gain.value=currentVolume*0.5;
  master.connect(audioCtx.destination);
  var notes=[261.63,293.66,329.63,392.00,440.00,523.25,440.00,392.00,329.63,293.66,261.63,329.63,392.00,440.00,523.25,440.00,392.00,329.63,293.66,261.63,293.66,329.63,392.00,440.00];
  var dur=0.9;var total=notes.length;var loopTime=total*dur*1000;
  var pad1=audioCtx.createOscillator();var pad2=audioCtx.createOscillator();var padGain=audioCtx.createGain();
  pad1.type='sine';pad1.frequency.value=130.81;pad2.type='sine';pad2.frequency.value=196.00;
  padGain.gain.value=0.04;var filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=300;
  pad1.connect(filter);pad2.connect(filter);filter.connect(padGain);padGain.connect(master);
  pad1.start();pad2.start();musicOscillators.push(pad1,pad2);
  function playLoop(){
    if(!isMusicPlaying)return;var now=audioCtx.currentTime;
    for(var i=0;i<total;i++){
      var osc=audioCtx.createOscillator();var g=audioCtx.createGain();
      osc.type='triangle';osc.frequency.value=notes[i];
      var st=now+i*dur;var en=st+dur*0.8;
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.12,st+0.08);
      g.gain.exponentialRampToValueAtTime(0.06,en-0.05);g.gain.linearRampToValueAtTime(0.001,en);
      osc.connect(g);g.connect(master);osc.start(st);osc.stop(en+0.01);
      musicOscillators.push(osc)
    }
    musicLoopId=setTimeout(playLoop,loopTime-100)
  }
  playLoop()
}
function startBM(){if(isMusicPlaying)return;isMusicPlaying=true;createGentleMelody();document.getElementById('musicToggle').classList.add('playing');document.getElementById('musicToggle').textContent='🔊'}
function stopBM(){isMusicPlaying=false;if(musicLoopId){clearTimeout(musicLoopId);musicLoopId=null;}musicOscillators.forEach(function(o){try{o.stop()}catch(e){}try{o.disconnect()}catch(e2){}});musicOscillators=[];document.getElementById('musicToggle').classList.remove('playing');document.getElementById('musicToggle').textContent='🎵'}
function toggleMusic(){if(isMusicPlaying){stopBM()}else{startBM()}}
function setVol(v){currentVolume=v/100;document.getElementById('volumeLabel').textContent=v+'%';if(isMusicPlaying){stopBM();createGentleMelody()}}
function playSound(type){if(!audioCtx)initAC();var osc=audioCtx.createOscillator();var gain=audioCtx.createGain();osc.type='sine';
  if(type==='click'){osc.frequency.value=800;gain.gain.setValueAtTime(0.1,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1)}
  else if(type==='page'){osc.frequency.value=600;gain.gain.setValueAtTime(0.08,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15)}
  else if(type==='sparkle'){osc.frequency.value=1200;gain.gain.setValueAtTime(0.05,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2)}
  osc.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+(type==='sparkle'?0.2:0.15))}
function toggleSettingsPanel(){document.getElementById('settingsPanel').classList.toggle('active')}
function resetSettings(){document.getElementById('fontSizeSlider').value=20;document.body.classList.remove('dark-mode');document.getElementById('fontSizeSlider').dispatchEvent(new Event('input'));toggleSettingsPanel()}
document.getElementById("startBtn").addEventListener("click",function(){goPage(0)});
document.getElementById("replayBtn").addEventListener("click",function(){document.getElementById("endingPage").style.display="none";document.getElementById("titlePage").style.display="flex"});
document.getElementById("continueBtn").addEventListener("click",function(){var sp=parseInt(localStorage.getItem("rainbowSeedLastPage"))||0;goPage(sp)});
document.getElementById("imageModal").addEventListener("click",closeM);
document.addEventListener("DOMContentLoaded",function(){
  renderP();
  var lp=parseInt(localStorage.getItem("rainbowSeedLastPage"))||0;
  if(lp>0&&lp<pages.length){
    document.getElementById("continueBtn").style.display="inline-block";
  }
});
</script>
