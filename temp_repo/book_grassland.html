.ending-page .rainbow-text{background:linear-gradient(90deg,#f44336,#ff9800,#ffeb3b,#4caf50,#2196f3,#3f51b5,#9c27b0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}



.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:2000;justify-content:center;align-items:center;cursor:pointer}

<body>








<div class="book-container">


  <div class="title-page" id="titlePage">


    <h1>🐴 <span class="rainbow-text">波波和朵朵的草原小英雄</span> 🐴</h1>


    <p class="subtitle">一個關於耐心、友誼和團隊合作的美好故事</p>


    <button class="start-btn" id="startBtn">開始閱讀 ⭐</button>


    <button class="continue-btn" id="continueBtn" disabled>繼續上次閱讀</button>


  </div>


  <div class="ending-page" id="endingPage">


    <h2>🎉 <span class="rainbow-text">感謝你閱讀這個故事</span> 🎉</h2>


    <p>就像波波和朵朵一樣，只要我們有耐心、願意付出愛心，就能創造出屬於自己的彩虹。</p>


    <button class="start-btn" id="replayBtn">再閱一次 🙌</button>


  </div>


  <div id="pagesContainer"></div>


  <div class="modal" id="imageModal"><img id="modalImage" src="" alt="放大圖片"></div>


  </div>


  <div class="control-panel">




    <button onclick="toggleDarkMode()" title="暗的模式" id="darkModeBtn">🌙</button>


  </div>


</div>

</body>

<script>

const scenesData = [
{"image": "scene01_grassland_friends.png", "text": "<p class=\"narration\">在一片遼闊美麗的大草原上住著一隻小羊波波和一隻小駱駝朵朵。</p><p class=\"narration\">波波是一隻可愛的小羊，朵朵是一隻溫柔的小駱駝，他們是彼此最好的朋友。</p>"},
{"image": "scene02_eagle_flying.png", "text": "<p class=\"narration\">一天。</p><p class=\"narration\">波波看見老鷹在天空翱翔，翅膀張得大大的，輕鬆自在地乘著風滑過藍天。</p>"},
{"image": "scene03_wish_to_fly.png", "text": "<p class=\"narration\">羨慕地說：</p><p class=\"dialog-sheep\">「要是我也會飛就好了。」</p><p class=\"narration\">波波望著天空，心裡充滿了羨慕與夢想。</p>"},
{"image": "scene04_first_failure.png", "text": "<p class=\"narration\">於是，他開始發明飛行器。</p><p class=\"narration\">第一天，他用樹枝和樹葉做了一架小飛機。結果剛飛起來就掉下來了。</p><p class=\"narration\">第一天，失敗了。</p>"},
{"image": "scene05_second_failure.png", "text": "<p class=\"narration\">第二天，他又用竹子和布做了一個新的飛行器。</p><p class=\"narration\">結果飛到一半又壞掉了。</p><p class=\"narration\">第二天，還是失敗了。</p>"},
{"image": "scene06_third_failure.png", "text": "<p class=\"narration\">第三天，波波沒有放棄，繼續嘗試。</p><p class=\"narration\">可是，第三天還是失敗了。</p><p class=\"narration\">波波看著一堆壞掉的零件，有點沮喪。</p>"},
{"image": "scene07_leaves_wings.png", "text": "<p class=\"narration\">有一次，他用大樹的樹葉做翅膀，綁在自己的手臂上。</p><p class=\"narration\">結果剛跳起來就摔進草堆裡，滿身都是草屑。</p><p class=\"narration\">大家都笑了。</p>"},
{"image": "scene08_balloons_mud.png", "text": "<p class=\"narration\">有一次，他綁了十幾顆五顏六色的氣球。</p><p class=\"narration\">結果被大風吹得飛起來，卻被吹進泥巴坑裡。</p><p class=\"narration\">波波全身都是泥巴，大家笑得更厲害了。</p>"},
{"image": "scene09_others_laugh.png", "text": "<p class=\"narration\">大家都笑了。</p><p class=\"narration\">甚至有人說：</p><p class=\"narration\">「別試了，你不可能成功的。」</p><p class=\"narration\">波波有點難過，耳朵都垂了下來。</p>"},
{"image": "scene10_continue_research.png", "text": "<p class=\"narration\">但波波並沒有真正難過太久。</p><p class=\"narration\">他回到自己的小工作間，繼續研究飛行器。</p><p class=\"narration\">朵朵則一直陪著他。</p>"},
{"image": "scene11_camel_helps.png", "text": "<p class=\"narration\">朵朵幫波波畫圖，把他想到的設計都畫下來。</p><p class=\"dialog-camel\">我來幫你畫圖，這樣就不會忘記好點子了。</p><p class=\"narration\">朵朵認真地幫忙畫著每一個設計圖。</p>"},
{"image": "scene12_record_failures.png", "text": "<p class=\"narration\">朵朵幫忙測試每一個小零件。</p><p class=\"narration\">朵朵還幫忙記錄每一次失敗的原因。</p><p class=\"dialog-camel\">這次是重心不對，下次調整一下應該就可以。</p><p class=\"narration\">每一次失敗，朵朵都幫波波找出問題所在。</p>"},
{"image": "scene13_hundredth_experiment.png", "text": "<p class=\"narration\">終於，在第一百次實驗時。</p><p class=\"narration\">波波做出了一架精緻的小滑翔翼。</p><p class=\"narration\">這一次，他用輕便的木材做骨架，用柔軟的布做機翼。</p>"},
{"image": "scene14_glider_flight.png", "text": "<p class=\"narration\">雖然只飛了短短幾秒鐘。</p><p class=\"narration\">卻真的離開了地面！在空中飛了一小段距離。</p><p class=\"dialog-sheep\">成功了！我真的飛起來了！</p>"},
{"image": "scene15_success_celebration.png", "text": "<p class=\"narration\">波波激動得跳了起開。</p><p class=\"narration\">「成功了！」</p><p class=\"narration\">大家都跑來鼓掌，草原上充滿了歡呼和歡笑聲。</p>"},
{"image": "scene16_worth_it_question.png", "text": "<p class=\"narration\">有人問：</p><p class=\"narration\">「第一百次才成功，值得嗎？」</p><p class=\"narration\">波波想了想，臉上浮現出溫暖的笑容。</p>"},
{"image": "scene17_wisdom_answer.png", "text": "<p class=\"dialog-sheep\">笑著回答：</p><p class=\"dialog-sheep\">其實我不是第一百次才成功。</p><p class=\"dialog-sheep\">前面九十九次，我都學會了一件新事情。</p><p class=\"narration\">波波的眼裡閃耀著自信的光芒。</p>"},
{"image": "scene18_sunset_friends.png", "text": "<p class=\"dialog-camel\">朵朵豎起大拇指：</p><p class=\"dialog-camel\">所以你早就在進步了。</p><p class=\"narration\">夕陽下，兩位好朋友看著滑翔翼，笑得特別開心。</p><p class=\"narration\">草原被染成了一片金黃，溫暖而美好。</p>"}
];

var pages = scenesData;
var currentPage=-1,saveTimeout=null,audioCtx=null,musicOscillators=[],musicLoopId=null,isMusicPlaying=false,currentVolume=0.3;

function goPage(pi){
  playSound("page");
  if(pi>=0)document.getElementById("titlePage").style.display="none";
  var ap=document.querySelectorAll(".book-page");
  for(var i=0;i<ap.length;i++){ap[i].classList.remove("active");ap[i].classList.remove("flip-left");ap[i].classList.remove("flip-right")}
  if(pi>=0&&pi<pages.length){
    var page=document.getElementById("page-"+pi);
    page.classList.add("active");
    page.classList.add(pi>currentPage?"flip-right":"flip-left");
    currentPage=pi;
    localStorage.setItem("grasslandHeroPage",pi);
    localStorage.setItem("grasslandHeroLastPage",pi);
    updProg();
    window.scrollTo({top:0,behavior:"smooth"})
  }
}

function goHome(){window.location.href="index.html"}function prevP(){if(currentPage>0)goPage(currentPage-1)}

function nextP(){
  if(currentPage<pages.length-1)goPage(currentPage+1);
  else{
    var ap=document.querySelectorAll(".book-page");
    for(var i=0;i<ap.length;i++)ap[i].classList.remove("active");
    document.getElementById("endingPage").style.display="block";
    window.scrollTo({top:0,behavior:"smooth"})
  }
}

function openM(el){var img=el.querySelector("img");document.getElementById("modalImage").src=img.src;document.getElementById("imageModal").classList.add("active")}
function closeM(){document.getElementById("imageModal").classList.remove("active")}

function updProg(){
  var p=document.querySelector(".progress-fill");
  if(p&&currentPage>=0)p.style.width=((currentPage+1)/pages.length*100)+"%";
  var nb=document.getElementById("pageNum");
  if(nb)nb.textContent=(currentPage+1)+"/"+pages.length;
  var cb=document.getElementById("continueBtn");
  if(cb){var sp=parseInt(localStorage.getItem("grasslandHeroLastPage"))||0;if(sp>=0&&sp<pages.length){cb.disabled=false;cb.textContent="\u7e8c\u7e8c\u4e0a\u6b21\u95b1\u8b80 \u7b2c"+(sp+1)+"\u9801"}else{cb.disabled=true;cb.textContent="\u7e8c\u7e8c\u4e0a\u6b21\u95b1\u8b80"}}
}

function renderP(){
  var c=document.getElementById("pagesContainer");if(!c)return;
  for(var i=0;i<pages.length;i++){
    var p=pages[i],d=document.createElement("div");
    d.className="book-page";d.id="page-"+i;
    var imgDiv="<div class=\"page-image-container\" onclick=\"openM(this);playSound(\x27sparkle\x27)\">";

  var pageNum="<span class=\"page-number\" id=\"pageNum\">"+(i+1)+"/"+pages.length+"</span>";

}

function initAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}

function createGentleMelody(){if(!audioCtx)initAC();if(musicLoopId){clearTimeout(musicLoopId);musicLoopId=null;}musicOscillators.forEach(function(o){try{o.stop()}catch(e){}try{o.disconnect()}catch(e2){}});musicOscillators=[];var master=audioCtx.createGain();master.gain.value=currentVolume*0.5;master.connect(audioCtx.destination);var notes=[261.63,293.66,329.63,392.00,440.00,523.25,440.00,392.00,329.63,293.66,261.63,329.63,392.00,440.00,523.25,440.00,392.00,329.63,293.66,261.63,293.66,329.63,392.00,440.00];var dur=0.9;var total=notes.length;var loopTime=total*dur*1000;var pad1=audioCtx.createOscillator();var pad2=audioCtx.createOscillator();var padGain=audioCtx.createGain();pad1.type='sine';pad1.frequency.value=130.81;pad2.type='sine';pad2.frequency.value=196.00;padGain.gain.value=0.04;var filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=300;pad1.connect(filter);pad2.connect(filter);filter.connect(padGain);padGain.connect(master);pad1.start();pad2.start();musicOscillators.push(pad1,pad2);function playLoop(){if(!isMusicPlaying)return;var now=audioCtx.currentTime;for(var i=0;i<total;i++){var osc=audioCtx.createOscillator();var g=audioCtx.createGain();osc.type='triangle';osc.frequency.value=notes[i];var st=now+i*dur;var en=st+dur*0.8;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.12,st+0.08);g.gain.exponentialRampToValueAtTime(0.06,en-0.05);g.gain.linearRampToValueAtTime(0.001,en);osc.connect(g);g.connect(master);osc.start(st);osc.stop(en+0.01);musicOscillators.push(osc)}musicLoopId=setTimeout(playLoop,loopTime-100)}playLoop()}

function playLoop(){if(!isMusicPlaying)return;var now=audioCtx.currentTime;for(var i=0;i<total;i++){var osc=audioCtx.createOscillator();var g=audioCtx.createGain();osc.type='triangle';osc.frequency.value=notes[i];var st=now+i*dur;var en=st+dur*0.8;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.12,st+0.08);g.gain.exponentialRampToValueAtTime(0.06,en-0.05);g.gain.linearRampToValueAtTime(0.001,en);osc.connect(g);g.connect(master);osc.start(st);osc.stop(en+0.01);musicOscillators.push(osc)}musicLoopId=setTimeout(playLoop,loopTime-100)}

function playSound(type){if(!audioCtx)initAC();var osc=audioCtx.createOscillator();var gain=audioCtx.createGain();osc.type='sine';if(type==='click'){osc.frequency.value=800;gain.gain.setValueAtTime(0.1,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1)}else if(type==='page'){osc.frequency.value=600;gain.gain.setValueAtTime(0.08,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15)}else if(type==='sparkle'){osc.frequency.value=1200;gain.gain.setValueAtTime(0.05,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2)}osc.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+(type==='sparkle'?0.2:0.15))}
