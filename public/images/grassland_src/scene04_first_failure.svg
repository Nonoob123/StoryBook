<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76D7C4" />
      <stop offset="50%" stop-color="#A2D9CE" />
      <stop offset="100%" stop-color="#E8F8F5" />
    </linearGradient>
  
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52BE80" />
      <stop offset="100%" stop-color="#27AE60" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#sky)" />

  <!-- Sun details -->
  
    <circle cx="700" cy="100" r="40" fill="#F1C40F" opacity="0.8" />
  

  <!-- Fluffy Cloud -->
  <path d="M 450,110 Q 470,80 500,90 Q 530,80 540,100 T 570,125 T 530,140 L 440,140 Z" fill="#FFF" opacity="0.8" />

  <!-- Expansive Rolling Hills -->
  <path d="M -100,430 C 100,380 400,380 600,430 T 900,410 L 900,600 L -100,600 Z" fill="#1E8449" opacity="0.25" />
  <path d="M -100,460 C 200,410 500,420 800,460 L 800,620 L -100,620 Z" fill="#1E8449" opacity="0.45" />

  <!-- Base Grassland Ground -->
  <path d="M -50,480 C 150,450 450,450 850,480 L 850,640 L -50,640 Z" fill="url(#ground)" />

  <!-- Title Badge Top Left -->
  <g transform="translate(50, 45)">
    <rect width="180" height="32" rx="16" fill="white" opacity="0.9" />
    <text x="90" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="middle">
      🦅 草原小英雄
    </text>
  </g>

  <!-- Custom grassland SVG features -->
  
      <text x="220" y="350" font-size="45">🙀</text>
      <!-- Crash cloud -->
      <circle cx="500" cy="470" r="50" fill="#EAECEE" opacity="0.7" />
    

  <!-- Emojis and characters -->
  
      <text x="280" y="460" font-size="130" text-anchor="middle">🐑</text>
      <!-- Broken branch wings -->
      <text x="500" y="480" font-size="100" text-anchor="middle">🎋</text>
      <text x="480" y="430" font-size="35">🍂</text>
      <text x="530" y="430" font-size="35">🍂</text>
    

</svg>